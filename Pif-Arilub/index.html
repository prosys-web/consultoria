<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIF — Painel em Manutenção | AriLub</title>
  <style>
    :root {
      --navy: #00358f;
      --blue: #159bd7;
      --red: #ed1c24;
      --bg: #f7f9fc;
      --ink: #17212b;
      --muted: #6b7785;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(21,155,215,.10), transparent 26%),
        radial-gradient(circle at 88% 86%, rgba(0,53,143,.10), transparent 30%),
        var(--bg);
      overflow: hidden;
    }
    .page {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .shape { position: absolute; pointer-events: none; opacity: .98; }
    .shape.tl {
      top: -130px; left: -155px; width: 430px; height: 430px; border-radius: 50%;
      border: 46px solid var(--navy); border-right-color: transparent; border-bottom-color: transparent;
      transform: rotate(-10deg);
    }
    .shape.tl::after {
      content: ""; position: absolute; inset: 55px; border-radius: 50%;
      border: 18px solid var(--red); border-right-color: transparent; border-bottom-color: transparent;
    }
    .shape.br {
      right: -170px; bottom: -150px; width: 460px; height: 460px; border-radius: 50%;
      border: 54px solid var(--navy); border-left-color: transparent; border-top-color: transparent;
      transform: rotate(-10deg);
    }
    .shape.br::after {
      content: ""; position: absolute; inset: 64px; border-radius: 50%;
      border: 18px solid var(--red); border-left-color: transparent; border-top-color: transparent;
    }
    .card {
      width: min(880px, 92vw);
      text-align: center;
      padding: 52px 42px 46px;
      position: relative;
      z-index: 2;
    }
    .logo {
      width: min(500px, 78vw);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }
    .icon {
      width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 24px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #ffffff, #eaf2fb);
      box-shadow: 0 18px 45px rgba(0,53,143,.12);
      border: 1px solid rgba(0,53,143,.08);
      font-size: 46px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: -.03em;
      color: var(--navy);
      font-weight: 900;
    }
    h1 span { color: var(--red); }
    .divider {
      width: 180px; height: 5px; border-radius: 999px;
      margin: 30px auto 24px;
      background: linear-gradient(90deg, var(--blue) 0 58%, var(--red) 58% 100%);
    }
    .note {
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      font-style: italic;
    }
    .tag {
      margin-top: 18px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #8b96a3;
      font-weight: 700;
    }
    @media (max-width: 640px) {
      .card { padding: 34px 16px; }
      .logo { margin-bottom: 22px; }
      .icon { width: 82px; height: 82px; font-size: 38px; }
      .shape.tl, .shape.br { transform: scale(.72); }
    }
  </style>
</head>
