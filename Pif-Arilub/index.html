<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIF · ARILUB</title>
<style>
:root{--navy:#1F2D5C;--gold:#B8863B;--cream:#F4F1EA;--bg:#F7F5F0;--white:#fff;--text:#243047;--muted:#6d7480;--green:#23845b;--red:#b94b4b;--blue:#2a78d6;--orange:#eb6834;--line:#e4dfd5;--shadow:0 5px 18px rgba(31,45,92,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}.topbar{background:var(--navy);color:#fff;padding:16px 22px}.topin{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;font-weight:800;letter-spacing:.5px}.brand h1{font-size:18px;margin:0}.brand small{opacity:.78}.status{text-align:right;font-size:12px;line-height:1.5}.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.navin{max-width:1280px;margin:auto;display:flex;overflow:auto}.nb{border:0;background:transparent;padding:14px 16px;color:var(--navy);font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}.nb.active{border-color:var(--gold);color:var(--gold)}.wrap{max-width:1280px;margin:0 auto;padding:22px}.sec{display:none}.sec.on{display:block}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{margin:0;color:var(--navy);font-size:23px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.pbtns{display:flex;gap:7px;flex-wrap:wrap}.pbtn{border:1px solid #d5cfbf;background:#fff;color:var(--navy);padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}.pbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.kpi4,.kpi5,.kpi6{display:grid;gap:12px;margin-bottom:14px}.kpi4{grid-template-columns:repeat(4,1fr)}.kpi5{grid-template-columns:repeat(5,1fr)}.kpi6{grid-template-columns:repeat(6,1fr)}.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);padding:15px;border-radius:7px;box-shadow:var(--shadow);min-width:0}.kpi.blue{border-left-color:var(--blue)}.kpi.green{border-left-color:var(--green)}.kpi.red{border-left-color:var(--red)}.kpi.orange{border-left-color:var(--orange)}.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.45px;color:var(--muted);font-weight:800}.kpi .val{font-size:24px;font-weight:800;color:var(--navy);margin-top:5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.card h3{margin:0 0 12px;color:var(--navy);font-size:16px}.note{background:var(--cream);border-left:4px solid var(--gold);padding:11px 13px;font-size:12px;line-height:1.55;margin-bottom:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}thead th{background:var(--navy);color:#fff;text-align:left;padding:10px;white-space:nowrap}tbody td{padding:9px 10px;border-bottom:1px solid #eee;vertical-align:top}tbody tr:hover{background:#faf8f3}.num{text-align:right;font-variant-numeric:tabular-nums}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:var(--cream);color:var(--navy)}.conta-row{display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.conta-row:last-child{border-bottom:0}.conta-row strong{color:var(--navy)}.insight-item{border-left:4px solid var(--gold);background:#fff;padding:13px 14px;margin-bottom:10px;border-radius:5px;box-shadow:var(--shadow);line-height:1.5}.error{max-width:800px;margin:70px auto;background:#fff;border:1px solid #e1d9c8;border-left:5px solid var(--red);padding:24px;box-shadow:var(--shadow)}footer{text-align:center;color:#777;font-size:11px;padding:24px 0 35px}.loading{padding:50px;text-align:center;color:var(--navy);font-weight:700}
@media(max-width:950px){.kpi4,.kpi5,.kpi6{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.conta-row{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{padding:14px}.kpi4,.kpi5,.kpi6{grid-template-columns:1fr}.topin{align-items:flex-start;flex-direction:column}.status{text-align:left}.kpi .val{font-size:21px}}
</style>
</head>
<body>
<div class="topbar"><div class="topin"><div class="brand"><div class="logo">AL</div><div><h1>PIF · ARILUB</h1><small>Painel de Inteligência Financeira</small></div></div><div class="status"><div id="metaBase">Carregando base...</div><div id="metaGerado"></div></div></div></div>
<div class="nav"><div class="navin">
<button class="nb active" data-sec="dashboard">Dashboard</button><button class="nb" data-sec="fluxo">Fluxo Projetado</button><button class="nb" data-sec="recebiveis">Recebíveis</button><button class="nb" data-sec="pagamentos">Pagamentos</button><button class="nb" data-sec="contas">Contas</button><button class="nb" data-sec="insights">Insights</button>
</div></div>
<div id="app" class="wrap"><div class="loading">Carregando pif-data.json...</div></div>
<div class="wrap"><footer>Painel de Inteligência Financeira · ARILUB Distribuidora Ltda · Fonte: Shop Control 9 / SQL Server · SQL somente leitura</footer></div>
<script>
const CACHE_KEY='ARILUB_PIF_LAST_VALID_V20';
let DATA=null;
const state={dashboard:30,fluxo:7,recebiveis:7,pagamentos:7,contas:7,insights:30};
const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n=v=>Number(v)||0;
function parseBR(s){if(!s)return null;const [d,m,y]=String(s).split('/').map(Number);return new Date(y,m-1,d,12,0,0)}
function fmtDate(d){return d.toLocaleDateString('pt-BR')}
function addDays(d,x){const r=new Date(d);r.setDate(r.getDate()+x);return r}
function dayKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function sum(a,fn=x=>x){return a.reduce((s,x)=>s+n(fn(x)),0)}
function baseDate(){return parseBR(DATA.metadata.data_base)}
function inWindow(dateStr,days){const d=parseBR(dateStr),b=baseDate(),e=addDays(b,days);return d&&d>=b&&d<=e}
function receb(days){return DATA.recebiveis.filter(x=>inWindow(x.Vencimento,days))}
function pagar(days){return DATA.pagamentos.filter(x=>inWindow(x.Vencimento,days))}
function debitos(days){return DATA.debitos_programados.filter(x=>inWindow(x.Data,days))}
function conta(c){return DATA.contas.find(x=>x.Conta===c)||{Saldo:0,Nome:c,'Data posição':null}}
function saldoConsolidado(){return sum(DATA.contas.filter(x=>x.Incluir_saldo_consolidado),x=>x.Saldo)}
function dispOperacional(){return sum(DATA.contas.filter(x=>x.Incluir_disponibilidade_operacional),x=>x.Saldo)}
function reserva(){return sum(DATA.contas.filter(x=>x.Classificacao==='RESERVA'),x=>x.Saldo)}
function horizon(days){const label=days===0?'Hoje':days+' dias';return DATA.horizontes.find(x=>x.Horizonte===label)}
function pbuttons(sec){return `<div class="pbtns">${[0,7,15,30].map(d=>`<button class="pbtn ${state[sec]===d?'active':''}" onclick="setPeriod('${sec}',${d})">${d===0?'Hoje':d+' dias'}</button>`).join('')}</div>`}
function setPeriod(sec,d){state[sec]=d;renderSection(sec)}
function rowsEmpty(cols,msg='Nenhum lançamento na janela selecionada.'){return `<tr><td colspan="${cols}" class="muted">${msg}</td></tr>`}
function dailyFlow(days){const b=baseDate(), rec=receb(days), pag=pagar(days), deb=debitos(days);let saldo=dispOperacional();const out=[];for(let i=0;i<=days;i++){const dt=addDays(b,i),k=dayKey(dt);const same=s=>{const x=parseBR(s);return x&&dayKey(x)===k};const ent=sum(rec.filter(x=>same(x.Vencimento)),x=>x.Valor);const cp=sum(pag.filter(x=>same(x.Vencimento)),x=>x.Valor);const db=sum(deb.filter(x=>same(x.Data)),x=>x.Valor);const sai=cp+db;saldo+=ent-sai;out.push({dt,ent,cp,db,sai,saldo});}return out}
function navEvents(){document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));document.getElementById('s-'+b.dataset.sec).classList.add('on');renderSection(b.dataset.sec)})}
function renderShell(){document.getElementById('app').innerHTML=`<section id="s-dashboard" class="sec on"></section><section id="s-fluxo" class="sec"></section><section id="s-recebiveis" class="sec"></section><section id="s-pagamentos" class="sec"></section><section id="s-contas" class="sec"></section><section id="s-insights" class="sec"></section>`;navEvents();['dashboard','fluxo','recebiveis','pagamentos','contas','insights'].forEach(renderSection)}
function renderSection(sec){if(sec==='dashboard')renderDashboard();if(sec==='fluxo')renderFluxo();if(sec==='recebiveis')renderRecebiveis();if(sec==='pagamentos')renderPagamentos();if(sec==='contas')renderContas();if(sec==='insights')renderInsights()}

// DASHBOARD: mantido como visão executiva. A migração abaixo não altera sua lógica central.
function renderDashboard(){const d=state.dashboard,h=horizon(d)||{};const rec=n(h['Recebimentos acumulados']),pag=n(h['Pagamentos acumulados']),deb=n(h['Débitos bancários acumulados']),sai=n(h['Saídas acumuladas']);const bnb=conta('BNB');const outros=n(conta('BRADESCO').Saldo)+n(conta('ITAU').Saldo)+n(conta('SANTANDER').Saldo);const topR=[...receb(d)].sort((a,b)=>n(b.Valor)-n(a.Valor)).slice(0,10);const topS=[...pagar(d).map(x=>({...x,tipo:'Conta a pagar',nome:x.Fornecedor,desc:x['Descrição'],data:x.Vencimento})),...debitos(d).map(x=>({...x,tipo:'Débito programado',nome:x.Banco,desc:x.Descricao,data:x.Data}))].sort((a,b)=>n(b.Valor)-n(a.Valor)).slice(0,10);
document.getElementById('s-dashboard').innerHTML=`<div class="section-head"><div><h2>Dashboard</h2><p>Visão executiva da posição financeira e do horizonte selecionado.</p></div>${pbuttons('dashboard')}</div><div class="kpi4"><div class="kpi"><div class="lab">Saldo Consolidado</div><div class="val">${money(saldoConsolidado())}</div><div class="sub">Operacional + reserva real</div></div><div class="kpi blue"><div class="lab">Disponibilidade Operacional</div><div class="val">${money(dispOperacional())}</div><div class="sub">Base das projeções</div></div><div class="kpi green"><div class="lab">Entradas</div><div class="val">${money(rec)}</div><div class="sub">Recebíveis até ${h['Até']||DATA.metadata.data_base}</div></div><div class="kpi red"><div class="lab">Saídas</div><div class="val">${money(sai)}</div><div class="sub">Pagamentos + débitos programados</div></div></div><div class="kpi5"><div class="kpi"><div class="lab">Contas a Pagar</div><div class="val">${money(pag)}</div></div><div class="kpi orange"><div class="lab">Débitos Programados</div><div class="val">${money(deb)}</div></div><div class="kpi"><div class="lab">Reserva Financeira</div><div class="val">${money(reserva())}</div><div class="sub">BNB FIF Institucional · 1017</div></div><div class="kpi"><div class="lab">BNB Operacional</div><div class="val">${money(bnb.Saldo)}</div><div class="sub">Posição ${bnb['Data posição']||'sem movimento'}</div></div><div class="kpi"><div class="lab">Outros Bancos</div><div class="val">${money(outros)}</div><div class="sub">Bradesco + Itaú + Santander</div></div></div><div class="grid2"><div class="card"><h3>Top 10 Recebimentos</h3><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>${topR.length?topR.map(x=>`<tr><td>${x.Cliente}</td><td>${x.Vencimento}</td><td class="num positive">${money(x.Valor)}</td></tr>`).join(''):rowsEmpty(3)}</tbody></table></div></div><div class="card"><h3>Top 10 Saídas</h3><div class="table-wrap"><table><thead><tr><th>Origem</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>${topS.length?topS.map(x=>`<tr><td><strong>${x.nome}</strong><br><span class="muted">${x.tipo}</span></td><td>${x.data}</td><td class="num negative">${money(x.Valor)}</td></tr>`).join(''):rowsEmpty(3)}</tbody></table></div></div></div>`}

function renderFluxo(){const d=state.fluxo,flow=dailyFlow(d),h=horizon(d)||{};document.getElementById('s-fluxo').innerHTML=`<div class="section-head"><div><h2>Fluxo Projetado</h2><p>Todos os dias da janela selecionada. O saldo parte da Disponibilidade Operacional e é encadeado dia a dia.</p></div>${pbuttons('fluxo')}</div><div class="kpi4"><div class="kpi blue"><div class="lab">Saldo Inicial Operacional</div><div class="val">${money(dispOperacional())}</div></div><div class="kpi green"><div class="lab">Entradas da Janela</div><div class="val">${money(sum(flow,x=>x.ent))}</div></div><div class="kpi red"><div class="lab">Saídas da Janela</div><div class="val">${money(sum(flow,x=>x.sai))}</div></div><div class="kpi"><div class="lab">Saldo Final Projetado</div><div class="val">${money(flow.at(-1)?.saldo||dispOperacional())}</div><div class="sub">Referência SQL: ${money(h['Saldo projetado operacional'])}</div></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Data</th><th class="num">Entradas</th><th class="num">Contas a Pagar</th><th class="num">Débitos Programados</th><th class="num">Saídas</th><th class="num">Saldo Operacional Projetado</th></tr></thead><tbody>${flow.map(x=>`<tr><td><strong>${fmtDate(x.dt)}</strong></td><td class="num positive">${money(x.ent)}</td><td class="num negative">${money(x.cp)}</td><td class="num negative">${money(x.db)}</td><td class="num negative">${money(x.sai)}</td><td class="num"><strong>${money(x.saldo)}</strong></td></tr>`).join('')}</tbody></table></div></div><div class="note">A Reserva Financeira — BNB FIF Institucional (conta 1017) não participa da projeção operacional. Não há conciliação automática entre contas a pagar e débitos bancários programados.</div>`}

function renderRecebiveis(){const d=state.recebiveis,a=receb(d).sort((x,y)=>parseBR(x.Vencimento)-parseBR(y.Vencimento));document.getElementById('s-recebiveis').innerHTML=`<div class="section-head"><div><h2>Recebíveis</h2><p>Títulos individuais em aberto dentro da janela selecionada.</p></div>${pbuttons('recebiveis')}</div><div class="kpi4"><div class="kpi green"><div class="lab">Total da Janela</div><div class="val">${money(sum(a,x=>x.Valor))}</div></div><div class="kpi"><div class="lab">Quantidade de Títulos</div><div class="val">${a.length}</div></div><div class="kpi"><div class="lab">Maior Título</div><div class="val">${money(a.length?Math.max(...a.map(x=>n(x.Valor))):0)}</div></div><div class="kpi"><div class="lab">Até</div><div class="val" style="font-size:20px">${fmtDate(addDays(baseDate(),d))}</div></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Descrição</th><th>Emissão</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td><strong>${x.Cliente}</strong></td><td>${x.Descricao||''}</td><td>${x['Emissão']||''}</td><td>${x.Vencimento}</td><td class="num positive">${money(x.Valor)}</td></tr>`).join(''):rowsEmpty(5)}</tbody></table></div></div>`}

function renderPagamentos(){const d=state.pagamentos,p=pagar(d).sort((x,y)=>parseBR(x.Vencimento)-parseBR(y.Vencimento)),db=debitos(d).sort((x,y)=>parseBR(x.Data)-parseBR(y.Data));document.getElementById('s-pagamentos').innerHTML=`<div class="section-head"><div><h2>Pagamentos</h2><p>Contas a pagar e débitos bancários programados, mantidos como origens distintas.</p></div>${pbuttons('pagamentos')}</div><div class="kpi4"><div class="kpi red"><div class="lab">Contas a Pagar</div><div class="val">${money(sum(p,x=>x.Valor))}</div></div><div class="kpi orange"><div class="lab">Débitos Programados</div><div class="val">${money(sum(db,x=>x.Valor))}</div></div><div class="kpi"><div class="lab">Saídas Totais</div><div class="val">${money(sum(p,x=>x.Valor)+sum(db,x=>x.Valor))}</div></div><div class="kpi"><div class="lab">Lançamentos</div><div class="val">${p.length+db.length}</div></div></div><div class="card"><h3>Contas a Pagar</h3><div class="table-wrap"><table><thead><tr><th>Fornecedor</th><th>Descrição</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>${p.length?p.map(x=>`<tr><td><strong>${x.Fornecedor}</strong></td><td>${x['Descrição']||''}</td><td>${x.Vencimento}</td><td class="num negative">${money(x.Valor)}</td></tr>`).join(''):rowsEmpty(4)}</tbody></table></div></div><div class="card"><h3>Débitos Bancários Programados</h3><div class="table-wrap"><table><thead><tr><th>Banco</th><th>Descrição</th><th>Data</th><th class="num">Valor</th></tr></thead><tbody>${db.length?db.map(x=>`<tr><td><span class="pill">${x.Banco}</span></td><td>${x.Descricao||''}</td><td>${x.Data}</td><td class="num negative">${money(x.Valor)}</td></tr>`).join(''):rowsEmpty(4)}</tbody></table></div></div><div class="note">Regra homologada: não existe reconciliação/deduplicação automática entre Contas a Pagar e Débitos Bancários Programados.</div>`}

function renderContas(){const d=state.contas,ops=DATA.contas.filter(x=>x.Classificacao==='OPERACIONAL'),res=DATA.contas.filter(x=>x.Classificacao==='RESERVA');const byBank=b=>sum(debitos(d).filter(x=>x.Banco===b),x=>x.Valor);document.getElementById('s-contas').innerHTML=`<div class="section-head"><div><h2>Contas</h2><p>Posição bancária e impacto dos débitos programados dentro da janela selecionada.</p></div>${pbuttons('contas')}</div><div class="kpi4"><div class="kpi"><div class="lab">Saldo Consolidado Atual</div><div class="val">${money(saldoConsolidado())}</div></div><div class="kpi blue"><div class="lab">Disponibilidade Operacional</div><div class="val">${money(dispOperacional())}</div></div><div class="kpi orange"><div class="lab">Débitos Programados na Janela</div><div class="val">${money(sum(debitos(d),x=>x.Valor))}</div></div><div class="kpi"><div class="lab">Reserva 1017</div><div class="val">${money(reserva())}</div></div></div><div class="card"><h3>Contas Operacionais</h3><div class="conta-row muted"><div>Banco / posição</div><div class="num">Saldo atual</div><div class="num">Débitos na janela</div><div class="num">Saldo após débitos*</div></div>${ops.map(x=>{const db=byBank(x.Conta);return `<div class="conta-row"><div><strong>${x.Nome}</strong><br><span class="muted">SQL ${x.Ordem_SQL} · posição ${x['Data posição']||'não informada'}</span></div><div class="num">${money(x.Saldo)}</div><div class="num negative">${money(db)}</div><div class="num"><strong>${money(n(x.Saldo)-db)}</strong></div></div>`}).join('')}</div><div class="card"><h3>Reserva Financeira</h3>${res.map(x=>`<div class="conta-row"><div><strong>${x.Nome}</strong><br><span class="muted">SQL ${x.Ordem_SQL} · ${x['Data posição']?'posição '+x['Data posição']:'sem posição financeira registrada'}</span></div><div class="num">${money(x.Saldo)}</div><div class="num">—</div><div class="num"><span class="pill">Fora da projeção</span></div></div>`).join('')}</div><div class="note">* A coluna “Saldo após débitos” é uma visão bancária restrita aos débitos programados identificados por banco no JSON. Recebíveis e Contas a Pagar não possuem conta bancária de destino/origem no arquivo atual; por isso não são artificialmente distribuídos entre bancos. A projeção financeira completa permanece no Fluxo Projetado.</div>`}

function renderInsights(){const d=state.insights,h=horizon(d)||{},flow=dailyFlow(d),rec=n(h['Recebimentos acumulados']),pag=n(h['Pagamentos acumulados']),db=n(h['Débitos bancários acumulados']),sai=n(h['Saídas acumuladas']),final=flow.at(-1)?.saldo||dispOperacional(),min=flow.reduce((a,x)=>x.saldo<a.saldo?x:a,flow[0]);const maiorRec=[...receb(d)].sort((a,b)=>n(b.Valor)-n(a.Valor))[0];const maiorSai=[...pagar(d).map(x=>({nome:x.Fornecedor,data:x.Vencimento,valor:x.Valor})),...debitos(d).map(x=>({nome:x.Banco+' · débito programado',data:x.Data,valor:x.Valor}))].sort((a,b)=>n(b.valor)-n(a.valor))[0];document.getElementById('s-insights').innerHTML=`<div class="section-head"><div><h2>Insights</h2><p>Leitura dinâmica da janela selecionada, sem alterar os dados de origem.</p></div>${pbuttons('insights')}</div><div class="kpi4"><div class="kpi green"><div class="lab">Entradas</div><div class="val">${money(rec)}</div></div><div class="kpi red"><div class="lab">Saídas</div><div class="val">${money(sai)}</div></div><div class="kpi"><div class="lab">Resultado da Janela</div><div class="val">${money(rec-sai)}</div></div><div class="kpi blue"><div class="lab">Saldo Final Projetado</div><div class="val">${money(final)}</div></div></div><div class="insight-item"><strong>Liquidez projetada.</strong> A janela de ${d===0?'Hoje':d+' dias'} parte de ${money(dispOperacional())} de disponibilidade operacional e termina em ${money(final)}.</div><div class="insight-item"><strong>Composição das saídas.</strong> ${money(pag)} correspondem a contas a pagar e ${money(db)} a débitos bancários programados. Essas duas fontes permanecem separadas e não são conciliadas automaticamente.</div><div class="insight-item"><strong>Menor posição dentro da janela.</strong> ${money(min?.saldo||dispOperacional())} em ${min?fmtDate(min.dt):DATA.metadata.data_base}.</div>${maiorRec?`<div class="insight-item"><strong>Maior recebível da janela.</strong> ${maiorRec.Cliente}, ${money(maiorRec.Valor)}, vencimento em ${maiorRec.Vencimento}.</div>`:''}${maiorSai?`<div class="insight-item"><strong>Maior saída individual da janela.</strong> ${maiorSai.nome}, ${money(maiorSai.valor)}, em ${maiorSai.data}.</div>`:''}<div class="insight-item"><strong>Reserva financeira.</strong> BNB FIF Institucional (SQL 1017): ${money(reserva())}. A reserva integra o Saldo Consolidado, mas não a Disponibilidade Operacional nem o Fluxo Projetado.</div>`}

function validate(x){if(!x||!x.metadata||!x.metadata.data_base)throw new Error('metadata.data_base ausente');for(const k of ['contas','recebiveis','pagamentos','horizontes','debitos_programados'])if(!Array.isArray(x[k]))throw new Error(k+' ausente ou inválido');return x}
async function load(){let err=null;try{const r=await fetch('./pif-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);DATA=validate(await r.json());try{localStorage.setItem(CACHE_KEY,JSON.stringify(DATA))}catch(e){}}catch(e){err=e;try{const c=localStorage.getItem(CACHE_KEY);if(c)DATA=validate(JSON.parse(c))}catch(x){DATA=null}}if(!DATA){document.getElementById('app').innerHTML=`<div class="error"><h2>PIF · ARILUB</h2><p>Não foi possível carregar <strong>pif-data.json</strong> e não existe base válida de contingência.</p><p class="muted">${err?err.message:''}</p></div>`;return}document.getElementById('metaBase').textContent='Base: '+DATA.metadata.data_base+' · '+DATA.metadata.versao;document.getElementById('metaGerado').textContent='Atualizado: '+DATA.metadata.gerado_em;renderShell()}
load();
</script>
</body>
</html>
